name: Build Android APK

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install build tools & run tests
        run: |
          sudo apt-get update && sudo apt-get install -y aapt zipalign apksigner python3-pytest
          pytest tests/

      - name: Build and Sign APK
        run: |
          mkdir -p /root/android-sdk
          cp "$ANDROID_HOME/platforms/android-34/android.jar" /root/android-sdk/android.jar 2>/dev/null || cp "$ANDROID_HOME/platforms/"*/android.jar /root/android-sdk/android.jar
          find "$ANDROID_HOME/build-tools" -name "d8.jar" -o -name "r8.jar" | head -n 1 | xargs -I {} cp {} /root/android-sdk/r8.jar
          chmod +x ./build_apk.sh
          ./build_apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentic-essence-android
          path: android-app/bin/AgenticEssence-Android.apk

      - name: Publish APK to gh-pages downloads folder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/gh-pages-repo
          mkdir -p /tmp/gh-pages-repo/downloads
          cp android-app/bin/AgenticEssence-Android.apk /tmp/gh-pages-repo/downloads/AgenticEssence-Android.apk
          cp android-app/bin/AgenticEssence-Android.apk /tmp/gh-pages-repo/downloads/AngeticEssence-Android.apk
          cd /tmp/gh-pages-repo
          git add downloads/
          git commit -m "Auto-publish latest Agentic Essence Android APK build" || echo "no changes"
          git push
