<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="ncBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>
    <linearGradient id="ncHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ncCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="ncGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Space Background -->
  <rect width="500" height="500" rx="40" fill="url(#ncBgGrad)"/>
  <rect width="500" height="500" rx="40" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Outer Cyber Hexagon -->
  <polygon points="250,55 425,155 425,355 250,455 75,355 75,155" fill="none" stroke="url(#ncHexGrad)" stroke-width="8" stroke-opacity="0.6" filter="url(#ncGlow)"/>

  <!-- Neural Orbit Rings -->
  <circle cx="250" cy="255" r="140" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8 12" stroke-opacity="0.4"/>
  <circle cx="250" cy="255" r="110" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.5"/>

  <!-- Middle Hexagon Solid -->
  <polygon points="250,110 375,182 375,328 250,400 125,328 125,182" fill="#0b1124" stroke="url(#ncHexGrad)" stroke-width="6"/>

  <!-- Neural Core Geometry (LoRA Synapse Matrix) -->
  <!-- Synaptic Lines -->
  <line x1="250" y1="140" x2="250" y2="370" stroke="#8b5cf6" stroke-width="3" stroke-opacity="0.7"/>
  <line x1="150" y1="200" x2="350" y2="310" stroke="#00f0ff" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="150" y1="310" x2="350" y2="200" stroke="#ff007f" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Center Quantum Node -->
  <circle cx="250" cy="255" r="42" fill="#04060b" stroke="url(#ncCoreGrad)" stroke-width="5" filter="url(#ncGlow)"/>
  <circle cx="250" cy="255" r="22" fill="url(#ncCoreGrad)"/>
  <circle cx="250" cy="255" r="9" fill="#ffffff"/>

  <!-- Peripheral Neural Synapse Nodes -->
  <circle cx="250" cy="140" r="14" fill="#a855f7" stroke="#ffffff" stroke-width="3"/>
  <circle cx="250" cy="370" r="14" fill="#a855f7" stroke="#ffffff" stroke-width="3"/>
  <circle cx="150" cy="200" r="14" fill="#00f0ff" stroke="#ffffff" stroke-width="3"/>
  <circle cx="350" cy="310" r="14" fill="#00f0ff" stroke="#ffffff" stroke-width="3"/>
  <circle cx="150" cy="310" r="14" fill="#ff007f" stroke="#ffffff" stroke-width="3"/>
  <circle cx="350" cy="200" r="14" fill="#ff007f" stroke="#ffffff" stroke-width="3"/>
</svg>
